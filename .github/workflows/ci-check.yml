name: ci-check

# 轻量验证回路：不需要签名密钥，任何分支推送都能跑。
# build-release.yml 需要 ANDROID_KEYSTORE_BASE64 才能出包，
# 日常改代码用这个 workflow 验证编译/静态检查/单测即可。
on:
  push:
    branches-ignore:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # 需要完整历史才能算出与 main 的 merge-base（增量 format 检查用）
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: flutter pub get
        run: flutter pub get

      # analyze / test 是实质门禁，排在最前面：即使后面的格式检查挂了，
      # 也已经拿到了编译与单测的结论，一轮 CI 拿全部信号。
      #
      # 全仓只拦 error：CI 的 Flutter 比仓库开发时新，新增的 lint 会在未改动
      # 的上游代码上报出几十条 warning/info（截至接入时 48 条，0 条 error）。
      # 把它们当门禁等于要求先给整个上游做一遍 lint 清理，不现实。
      - name: flutter analyze（全仓，仅 error 阻断）
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 本分支**新增**的文件零容忍：新代码不许留 warning/info。
      #
      # 只卡新增文件、不卡修改过的文件：修改上游文件时，analyze 会把该文件里
      # 早就存在的问题一并报出来（例如给 player_service.dart 加一行 import，
      # 就会「命中」它原有的 unused_local_variable）。把存量问题算到本次改动
      # 头上，只会逼人去改无关代码。修改过的文件由上面的全仓 error 门禁兜底，
      # 存量 warning/info 在下一步里只提示、不阻断。
      - name: flutter analyze（新增文件零容忍 / 改动文件仅提示）
        if: always()
        run: |
          BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
          if [ -z "$BASE" ]; then echo "no merge-base, skip"; exit 0; fi
          ADDED=$(git diff --name-only --diff-filter=A "$BASE" HEAD -- 'lib/**.dart' 'test/**.dart')
          MODIFIED=$(git diff --name-only --diff-filter=MR "$BASE" HEAD -- 'lib/**.dart' 'test/**.dart')
          # analyze 的输出是「… • 路径:行:列 • 规则名」，按路径过滤。
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.txt 2>&1 || true

          if [ -n "$MODIFIED" ]; then
            echo "— 改动过的上游文件（仅提示，不阻断）—"
            for f in $MODIFIED; do grep -F " • $f:" analyze.txt || true; done
          fi

          if [ -z "$ADDED" ]; then echo "本分支无新增 dart 文件"; exit 0; fi
          echo "— 新增文件（零容忍）—"; echo "$ADDED"
          HITS=""
          for f in $ADDED; do
            MATCH=$(grep -F " • $f:" analyze.txt || true)
            if [ -n "$MATCH" ]; then HITS="$HITS$MATCH"$'\n'; fi
          done
          if [ -n "$HITS" ]; then
            echo "::error::本分支新增的文件存在 analyze 问题"
            echo "$HITS"
            exit 1
          fi
          echo "新增文件 analyze 干净"

      - name: flutter test
        if: always()
        run: flutter test

      # 未签名 debug APK：只验证 Android 侧（Kotlin/Gradle/AGP）能编过，
      # 不上传产物，避免占用 artifact 配额。
      - name: flutter build apk --debug
        if: always()
        run: flutter build apk --debug

      # 不做全仓 dart format 门禁：CI 的 Flutter 自带的 formatter 版本比仓库
      # 当初格式化时新，未改动的上游代码就会被判定为「需要重排」。
      #
      # 与上面的 analyze 门禁同理，只卡**新增**文件：对改动过的上游文件，
      # formatter 会连带重排该文件里本次没碰过的旧代码（例如往
      # player_service.dart 里加一个分支，它会顺手重排 400 行开外的三元
      # 表达式），那正是要避免的、与上游冲突的噪音 diff。
      # 直接打印 diff，方便在没有本地 Dart 工具链时照着改。
      - name: dart format（仅本分支新增的文件）
        if: always()
        run: |
          BASE=$(git merge-base origin/main HEAD 2>/dev/null || echo "")
          if [ -z "$BASE" ]; then echo "no merge-base, skip"; exit 0; fi
          FILES=$(git diff --name-only --diff-filter=A "$BASE" HEAD -- 'lib/**.dart' 'test/**.dart')
          if [ -z "$FILES" ]; then echo "本分支无新增 dart 文件"; exit 0; fi
          echo "检查以下文件："
          echo "$FILES"
          dart format $FILES
          if ! git diff --quiet -- $FILES; then
            echo "::error::以下文件需要重新格式化，diff 如下"
            git --no-pager diff -- $FILES
            exit 1
          fi
          echo "格式 OK"
