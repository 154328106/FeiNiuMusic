name: build-ios-ipa

# 免签 IPA：不需要 Apple 开发者证书，产物用越狱环境 / TrollStore / 自签工具安装。
#
# 只用 workflow_dispatch 手动触发：macOS runner 的分钟数按 10 倍计费，
# 不适合每次 push 都跑。日常改 Dart 代码用 ci-check（Linux）验证即可，
# 需要装到手机上试的时候再手动跑这个。
#
# 两种触发方式：
#   - 推 `ios-build-*` tag：从任意分支触发。GitHub 要求 workflow_dispatch 的
#     文件必须已经在**默认分支**上才能手动触发，本 workflow 还在特性分支上，
#     所以先用 tag 触发；合进 main 后 workflow_dispatch 才可用。
#   - workflow_dispatch：合进 main 之后用。
on:
  push:
    tags:
      - "ios-build-*"
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的分支或 tag（默认当前分支）"
        required: false
        default: ""

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          # 与本机/ci-check 一致，钉死避免 stable 漂移（见 ci-check.yml 说明）。
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: 环境信息
        run: |
          flutter --version
          xcodebuild -version
          echo "CocoaPods: $(pod --version)"

      - name: flutter pub get
        run: flutter pub get

      - name: 提取版本号
        id: version
        run: |
          FULL=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "VERSION=${FULL%%+*}" >> "$GITHUB_ENV"
          echo "版本：${FULL%%+*}"

      # --no-codesign 跳过签名；产物是未签名的 Runner.app。
      - name: 构建 iOS（免签）
        run: flutter build ios --release --no-codesign

      # IPA 就是把 .app 放进 Payload/ 再打成 zip。ditto 保留符号链接与资源
      # 分叉，用普通 zip 打出来的包在部分安装器上会解不开。
      - name: 打包 IPA
        run: |
          APP_PATH=build/ios/iphoneos/Runner.app
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::没有找到 $APP_PATH，构建可能失败了"
            exit 1
          fi
          echo "== 产物 Info.plist =="
          plutil -p "$APP_PATH/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|CFBundleDisplayName" || true
          echo "== 确认没有签名 =="
          codesign -dv "$APP_PATH" 2>&1 || echo "（未签名，符合预期）"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "Melodic-v${VERSION}-unsigned.ipa"
          ls -lh "Melodic-v${VERSION}-unsigned.ipa"

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: Melodic-unsigned-ipa
          path: Melodic-v*-unsigned.ipa
          if-no-files-found: error

  # Windows 绿色版：和 iOS 搭同一趟 ios-build-* tag 出，方便「试一版」时两端
  # 一起拿。逻辑照 build-release.yml 的 build-windows job，差别只在构建的 ref
  # 跟上面 iOS job 对齐（tag / workflow_dispatch 指定的分支），别出成默认分支。
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          # 与本 workflow 的 iOS job / ci-check 一致，钉死避免 stable 漂移。
          flutter-version: 3.47.4
          channel: stable
          cache: true

      - name: 提取版本号
        shell: powershell
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$' | Select-Object -First 1
          $full = $line.Matches[0].Groups[1].Value.Trim()
          $ver = $full.Split('+')[0]
          echo "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 构建并打包 Windows 绿色版
        shell: powershell
        run: .\scripts\package_windows.ps1 -Build

      - name: 拷贝 zip 到工作区根目录（避免 upload-artifact 保留目录前缀）
        shell: powershell
        run: |
          Copy-Item -Path build/installer/FeiNiuMusic-v*-Windows.zip -Destination . -Force

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: FeiNiuMusic-v*-Windows.zip
          if-no-files-found: error
